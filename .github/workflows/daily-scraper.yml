name: Daily Student Deals Scraper

on:
  schedule:
    # Runs daily at 09:00 UTC (3:00 AM Mountain Time)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      verify_ai_only:
        description: 'Classify a sample offer with Gemini without writing to the database'
        type: boolean
        default: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Student Deals Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VERIFY_AI_ONLY: ${{ inputs.verify_ai_only }}
        run: |
          if [ "$VERIFY_AI_ONLY" = "true" ]; then
            node scripts/verify-deal-ai.js
          else
            npm run scrape
          fi
